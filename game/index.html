<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#120a24" />
    <title>Slot Dayağı</title>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <canvas id="trail"></canvas>

    <div id="hud" hidden>
      <div class="top">
        <button id="btn-menu" class="icon" aria-label="Maskot seç">◀</button>
        <div class="who">
          <div class="names"><b id="ch-name"></b><small id="ch-slot"></small></div>
          <div class="bar"><div id="hp-fill"></div><span id="hp-label"></span></div>
        </div>
        <div id="coins">🪙 0</div>
        <button id="btn-mute" class="icon" aria-label="Ses">🔊</button>
      </div>
      <div id="bubble" hidden></div>
      <div id="floaters"></div>
      <div class="bottom">
        <div id="hint"></div>
        <div id="weapons"></div>
      </div>
    </div>

    <div id="menu" class="overlay">
      <h1>SLOT <span>DAYAĞI</span></h1>
      <p class="tag">Slotta sinirlendin mi? Gel, hıncını maskottan al.<br />Yeterince döversen MAX WIN veriyor.</p>
      <div id="cards"></div>
      <p class="note">Parodi oyunudur. Gerçek para yok, bahis yok. Gerçek slotlarda kasa hep kazanır — burası hariç.</p>
    </div>

    <div id="win" class="overlay" hidden>
      <div class="maxwin">MAX WIN</div>
      <div id="win-x"></div>
      <div id="win-who"></div>
      <div id="win-bonus"></div>
      <div class="row">
        <button id="btn-retry" class="cta">Tekrar döv</button>
        <button id="btn-other" class="cta ghost">Başka maskot</button>
      </div>
    </div>

    <div id="loading" hidden>Yükleniyor…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
